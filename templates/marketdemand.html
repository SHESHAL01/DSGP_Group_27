<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync – Market Demand Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='marketdemand.css') }}">
</head>

<body>

<header class="header">
    <div class="logo">
        <img src="{{ url_for('static', filename='Skill Sync Logo.png') }}" alt="SkillSync Logo">
    </div>

    <nav class="navbar">
        <ul>
            <li><a href="{{ url_for('skillsync_home') }}">Home</a></li>
            <li><a href="#" style="color: var(--accent-color);">Market Analysis</a></li>
            <li><a href="{{ url_for('education_alignment') }}">Edu Analysis</a></li>
            <li><a href="{{ url_for('employability_page') }}">Employability</a></li>
            <li><a href="{{ url_for('profile') }}">Profile</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </nav>
</header>

<main class="container">

    <!-- HERO -->
    <section class="hero">
        <h1>Market Demand Analyzer</h1>
        <p>Understand which skills employers in Sri Lanka value most for your role.</p>
    </section>

    <!-- INPUT CARD -->
    <section class="control-panel">
        <div class="control-content">
            <select id="roleSelect">
                <option value="software engineer">Software Engineer</option>
                <option value="qa engineer">QA Engineer</option>
                <option value="cybersecurity engineer">Cyber-Security Engineer</option>
                <option value="data engineer">Data Engineer</option>
                <option value="devops engineer">DevOps Engineer</option>
                <option value="embedded engineer">Embedded Engineer</option>
                <option value="data scientist">Data Scientist</option>
                <option value="data analyst">Data Analyst</option>
                <option value="database administrator">Database Administrator</option>
            </select>

            <button onclick="getSkills()" class="btn-primary">
                Analyze Market Demand
            </button>
        </div>
    </section>

    <!-- RESULTS -->
    <section id="results" class="results-section placeholder">
        <p class="placeholder-text">
            Select a role to view the most in-demand skills in the current job market.
        </p>
    </section>
</main>

<footer class="footer">
    © 2026 SkillSync | All Rights Reserved
</footer>

<script>
function getSkills() {
    const role = document.getElementById("roleSelect").value;
    const resultsSection = document.getElementById("results");
    
    // Show loading state
    resultsSection.innerHTML = '<div class="loading-message"><div class="spinner"></div><p>Analyzing market demand...</p></div>';
    resultsSection.classList.remove("placeholder");

    fetch("/market_demand", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ role: role })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            resultsSection.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ Error</h3>
                    <p>${data.error}</p>
                    <button onclick="getSkills()" class="retry-btn">Try Again</button>
                </div>
            `;
            return;
        }

        if (!data.skills || data.skills.length === 0) {
            const message = data.message || `We couldn't find specific skill data for "${role}".`;
            resultsSection.innerHTML = `
                <div class="info-message">
                    <h3>📊 No Data Available</h3>
                    <p>${message}</p>
                    <p>Try selecting another role or check back later as we update our database.</p>
                    <div class="suggestion">
                        <strong>Suggested roles to try:</strong><br>
                        Software Engineer, Data Engineer, DevOps Engineer, QA Engineer
                    </div>
                </div>
            `;
            return;
        }

        // Capitalize role name for display
        const displayRole = role.split(' ').map(word => 
            word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');

        let html = `
            <div class="results-header">
                <h2>🎯 Top Skills for ${displayRole}</h2>
                <p class="skill-count">${data.skills.length} in-demand skills found</p>
            </div>
            <div class="skills-cards">
        `;

        data.skills.forEach((skill, index) => {
            // Add some variety to the cards
            const delay = index * 50;
            html += `
                <div class="skill-card" style="animation-delay: ${delay}ms">
                    <span class="skill-name">${skill}</span>
                </div>
            `;
        });

        html += "</div>";
        
        if (data.skills.length < 10) {
            html += `<p class="note">📝 Showing ${data.skills.length} skills. More data will be added soon!</p>`;
        } else {
            html += `<p class="note">💡 Focus on these skills to improve your employability in ${displayRole} roles.</p>`;
        }

        resultsSection.innerHTML = html;
    })
    .catch(error => {
        console.error("Error:", error);
        resultsSection.innerHTML = `
            <div class="error-message">
                <h3>⚠️ Connection Error</h3>
                <p>There was a problem fetching the skill data. Please check your connection and try again.</p>
                <button onclick="getSkills()" class="retry-btn">Retry</button>
            </div>
        `;
    });
}

// Add keyboard support
document.getElementById("roleSelect").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        getSkills();
    }
});
</script>
</body>
</html>
